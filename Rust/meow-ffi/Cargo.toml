[package]
name = "meow-ffi"
version = "0.21.2"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "C FFI bridge embedding the meow-rs proxy kernel for BaoLianDeng."
publish = false

[lib]
name = "meow_ffi"
crate-type = ["staticlib"]

[dependencies]
# meow-rs kernel crates, pinned to the GLOBAL default fix (meow-rs/meow-rs#501).
# Protocol features mirror meow-app's `full` protocol set, INCLUDING
# `ech-tls-tunnel` (pulls rustls/aws_lc_rs via meow-transport's `ech` feature —
# aws-lc-sys builds fine for both darwin arches) and `boring-tls`, which is
# what makes `client-fingerprint:` (uTLS Client Hello spoofing) actually take
# effect; without it meow-transport parses the key, warns once, and falls back
# to a plain rustls Client Hello. boring-sys vendors BoringSSL and builds it
# with cmake per arch — both darwin arches compile, so the universal lipo
# still works (see Makefile). `mux` is sing-mux multiplexing (`smux:` on an
# outbound); it is part of meow-app's `full` set, so it is listed here too.
meow-common = { git = "https://github.com/meow-rs/meow-rs.git", rev = "c2b072f59936545cf63df90a7e45c611b47f82f4" }
meow-config = { git = "https://github.com/meow-rs/meow-rs.git", rev = "c2b072f59936545cf63df90a7e45c611b47f82f4", default-features = false, features = ["ss", "trojan", "vless", "vless-vision", "vless-encryption", "vmess", "snell", "hysteria2", "anytls", "ech-tls-tunnel", "mux", "boring-tls"] }
meow-dns = { git = "https://github.com/meow-rs/meow-rs.git", rev = "c2b072f59936545cf63df90a7e45c611b47f82f4" }
meow-tunnel = { git = "https://github.com/meow-rs/meow-rs.git", rev = "c2b072f59936545cf63df90a7e45c611b47f82f4" }
meow-listener = { git = "https://github.com/meow-rs/meow-rs.git", rev = "c2b072f59936545cf63df90a7e45c611b47f82f4", default-features = false, features = ["listener-mixed"] }
meow-api = { git = "https://github.com/meow-rs/meow-rs.git", rev = "c2b072f59936545cf63df90a7e45c611b47f82f4" }
# meow-app is pulled in ONLY for its `health_check` lib helpers (url-test /
# fallback group probing). default-features = false drops its `full` bundle;
# protocol features (including boring-tls) come from meow-config above and
# unify onto the shared crate instances.
meow-app = { git = "https://github.com/meow-rs/meow-rs.git", rev = "c2b072f59936545cf63df90a7e45c611b47f82f4", default-features = false }

tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros"] }
parking_lot = "0.12"
dashmap = "6"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "registry"] }
# ring-backed rustls for our own diagnostics client. Note aws_lc_rs is now in
# the tree anyway via meow-transport's `ech` feature (ech-tls-tunnel above),
# and BoringSSL via `boring-tls`.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# Diagnostics HTTP client: SOCKS5 + rustls(ring); no default (native-tls/openssl).
reqwest = { version = "0.12", default-features = false, features = ["socks", "json", "rustls-tls"] }
serde_json = "1"
serde_yaml = "0.9"

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"
# panic = "unwind" (NOT abort): every exported fn wraps its body in
# std::panic::catch_unwind so a Rust panic never unwinds across the C ABI.
# abort would make catch_unwind useless and kill the process on any panic.
panic = "unwind"
